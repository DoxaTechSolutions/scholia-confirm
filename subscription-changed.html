<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Changed</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #6366f1;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 24px;
    }
    .logo {
      width: 64px;
      margin-bottom: 16px;
    }
    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://raw.githubusercontent.com/scholia-app/scholia-webpage/main/logo.png" alt="Scholia Logo" class="logo">
    <h1>Thank You for Upgrading!</h1>
    <p>Your subscription change was received.<br>
    Please check your status in the extension to confirm your new plan.<br>
    If you have any questions, please contact support.</p>
    <button class="btn" onclick="window.close()">Close Tab</button>
  </div>
</body>
</html>
